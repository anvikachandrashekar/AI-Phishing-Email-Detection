<!DOCTYPE html>
<html>
<head>
    <title>AI Phishing Email Detector</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        textarea {
            width: 60%;
            height: 150px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            font-size: 22px;
        }
    </style>
</head>
<body>

<h1>AI-Based Phishing Email Detection</h1>

<textarea id="email" placeholder="Paste email here..."></textarea><br><br>

<button onclick="checkEmail()">Check Email</button>

<div class="result" id="result"></div>

<script>
function checkEmail() {
    const email = document.getElementById("email").value;

    fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email })
    })
    .then(response => response.json())
    .then(data => {
        let text = data.prediction === 1 ? "⚠️ Phishing Email" : "✅ Safe Email";
        document.getElementById("result").innerText =
            text + " (Confidence: " + (data.confidence * 100).toFixed(2) + "%)";
    })
    .catch(error => {
        document.getElementById("result").innerText = "Error connecting to server!";
    });
}
</script>

</body>
</html>
